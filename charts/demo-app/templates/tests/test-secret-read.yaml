# `helm test <release>` runs this pod AFTER the release is installed.
# It is a Helm HOOK, not a normal resource: install/upgrade never create it,
# only `helm test` does. Exit 0 = test passed, non-zero = failed.
#
# End-to-end check through the Service: the page must say "read OK", which
# proves Service -> pod -> CSI mount -> Workload Identity -> Secret Manager.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-secret-read
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    # delete the previous test pod before a new run, and this one if it passes
    # (a failed pod is kept so you can read its logs)
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containers:
    - name: check
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          URL="http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}/"
          echo "GET $URL"
          PAGE=$(wget -qO- -T 10 "$URL")
          echo "$PAGE" | grep -q "read OK" && echo "PASS: app reports the secret was read" && exit 0
          echo "FAIL: page does not contain 'read OK'"; echo "$PAGE"; exit 1
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 32Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
