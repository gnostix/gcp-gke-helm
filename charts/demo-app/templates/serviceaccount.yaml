# The pod's identity. Workload Identity maps it to the IAM principal
#   principal://.../PROJECT.svc.id.goog/subject/ns/<namespace>/sa/<name>
# which Step 4 granted secretAccessor on the secret. No annotations needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
