# Tells the GKE Secret Manager add-on WHAT to fetch and under which file name.
# The pod's Deployment references this object by name in a CSI volume.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  provider: gke                  # the Google-managed add-on (not the open-source "gcp" provider)
  parameters:
    secrets: |
      - resourceName: {{ required "secret.resourceName is required" .Values.secret.resourceName | quote }}
        path: {{ .Values.secret.fileName | quote }}
